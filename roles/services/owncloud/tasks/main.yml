---
- name: Create workspace directory
  ansible.builtin.file:
    path: /home/tarn/builders/owncloud
    state: directory
    owner: tarn
    group: tarn
    mode: '0755'

- name: Nix configuration
  ansible.builtin.template:
    src: templates/{{ item }}
    dest: /home/tarn/builders/owncloud/
    owner: tarn
    group: tarn
    mode: '0644'
  loop:
    - flake.nix
    - guest.nix
    - configuration.nix
    - ocis-bin.nix
    - ocis-overlay.nix

- name: Build and deploy scripts
  ansible.builtin.template:
    src: "templates/{{ item }}"
    dest: "/home/tarn/builders/owncloud/{{ item }}"
    owner: tarn
    group: tarn
    mode: '0755'
  loop:
    - build-and-deploy


