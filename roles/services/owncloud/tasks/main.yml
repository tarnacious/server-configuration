- name: Create data disk
  ansible.builtin.command: qemu-img create -f qcow2 /var/kvm/images/owncloud-data.qcow2 1G
  args:
    creates: /var/kvm/images/owncloud-data.qcow2

- name: Create logs disk
  ansible.builtin.command: qemu-img create -f qcow2 /var/kvm/images/owncloud-logs.qcow2 1G
  args:
    creates: /var/kvm/images/owncloud-logs.qcow2

- name: Create host keys disk
  ansible.builtin.command: qemu-img create -f qcow2 /var/kvm/images/owncloud-keys.qcow2 1G
  args:
    creates: /var/kvm/images/owncloud-keys.qcow2

- name: Create certificates disk
  ansible.builtin.command: qemu-img create -f qcow2 /var/kvm/images/owncloud-certificates.qcow2 20G
  args:
    creates: /var/kvm/images/owncloud-certificates.qcow2

- name: Define ownCloud VM
  community.libvirt.virt:
    command: define
    name: "ocis"
    xml: "{{ lookup('template', 'templates/domain.xml') }}"

