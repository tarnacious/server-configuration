tarnbarford_logs_disk_size: "1G"
tarnbarford_certificates_disk_size: "1G"
tarnbarford_keys_disk_size: "1G"
tarnbarford_website_disk_size: "1G"

# Device labels
tarnbarford_root_label: "nixos"
tarnbarford_logs_label: "logs"
tarnbarford_certificates_label: "certificates"
tarnbarford_keys_label: "keys"
tarnbarford_website_label: "website"

# ACPI slot names: domain.xml pins the IPv4/IPv6 NICs to PCI slots 2/3.
tarnbarford_ipv4_interface: "ens2"
tarnbarford_ipv6_interface: "ens3"

# Website configuration
tarnbarford_web_root: "/var/www/{{ tarnbarford_fqdn }}"
tarnbarford_website_user: "website"
tarnbarford_website_group: "website"
tarnbarford_website_home: "/var/lib/{{ tarnbarford_website_user }}"

# ACME configuration
tarnbarford_acme_email: "tarn@{{ tarnbarford_fqdn }}"

# Git repositories
tarnbarford_website_repo: "https://github.com/tarnacious/website.git"
tarnbarford_website_repo_branch: "main"
tarnbarford_posts_repo: "https://github.com/tarnacious/posts.git"
tarnbarford_posts_repo_branch: "master"

# Logrotate configuration
tarnbarford_logrotate_size: "10M"
tarnbarford_logrotate_rotate: 5

# Journald configuration
tarnbarford_journald_system_max_use: "100M"
tarnbarford_journald_system_keep_free: "200M"
tarnbarford_journald_max_retention: "7days"

# Systemd timer configuration
tarnbarford_timer_on_boot_sec: "1min"
tarnbarford_timer_on_unit_active_sec: "30min"

