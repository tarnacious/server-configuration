---
# Explicit target: -i <test inventory> -l <one VM> -e @<runtime vars>.
# Do not use the Debian server playbook on this image.
- hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Require explicit target and instance addresses
      ansible.builtin.assert:
        that:
          - australia_provision_confirm | default(false) | bool
          - hosts.australia.ipv4 is defined
          - hosts.australia.ipv6 is defined
          - wireguard_private_key is defined
          - wireguard_peers is defined
          - wireguard_port is defined
      no_log: true
    - name: Create WireGuard directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Create DNS runtime directory
      ansible.builtin.file:
        path: /var/lib/australia/zones
        state: directory
        owner: root
        group: named
        mode: '0750'
    - name: Install runtime WireGuard configuration (private key)
      ansible.builtin.template:
        src: ../../../roles/australia/templates/wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: '0600'
      no_log: true
      register: wg_config
    - name: Render instance-specific authoritative zone
      vars:
        australia_zone_serial: "{{ lookup('pipe', 'date -u +%s') }}"
      ansible.builtin.template:
        src: ../../../roles/australia/templates/db.tarnbarford.net.j2
        dest: /var/lib/australia/zones/db.tarnbarford.net.pending
        owner: root
        group: named
        mode: '0640'
    - name: Validate zone before replacing live file
      ansible.builtin.command: /run/current-system/sw/bin/named-checkzone tarnbarford.net /var/lib/australia/zones/db.tarnbarford.net.pending
      changed_when: false
    - name: Publish validated zone
      ansible.builtin.command: mv /var/lib/australia/zones/db.tarnbarford.net.pending /var/lib/australia/zones/db.tarnbarford.net
      changed_when: true
    - name: Start or reload DNS
      ansible.builtin.systemd:
        name: bind
        state: restarted
        enabled: true
    - name: Start or restart VPN after key installation
      ansible.builtin.systemd:
        name: wg-quick-wg0
        state: "{{ 'restarted' if wg_config.changed else 'started' }}"
        enabled: true
